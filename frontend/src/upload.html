<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper-to-Project Upload Controller</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #0f172a;
            --border-color: #38bdf8; /* Accent border matching the sketch styling */
            --input-border: rgba(148, 163, 184, 0.3);
            --accent-blue: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --input-bg: #090d16;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* 
          Main layout wrapper: matches the sketch structure exactly.
          Stacked rectangular elements with a clean border line.
        */
        .upload-widget {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            position: relative;
        }

        /* Close Button overlay in top right corner */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            line-height: 1;
            transition: color 0.15s ease;
        }

        .close-btn:hover {
            color: #f1f5f9;
        }

        /* 1. Progress Bar Container at the top */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(148, 163, 184, 0.1);
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), #06b6d4);
            box-shadow: 0 0 8px var(--accent-blue);
            transition: width 0.1s linear;
        }

        /* 2. File Row Container (displays selected file and action button) */
        .input-row {
            display: flex;
            width: 100%;
            border-bottom: 2px solid var(--border-color);
            box-sizing: border-box;
        }

        /* Simulated File Name Input Box */
        .file-display-box {
            flex: 1;
            background: var(--input-bg);
            padding: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            border-right: 2px solid var(--border-color);
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        .file-display-box:hover {
            color: var(--text-main);
            background: #0d1322;
        }

        .file-display-box.selected {
            color: var(--text-main);
            font-weight: bold;
        }

        /* Action Upload Button */
        .upload-btn {
            background: var(--panel-bg);
            border: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 0.85rem;
            font-family: inherit;
            padding: 0 24px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .upload-btn:hover:not(:disabled) {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .upload-btn:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* 3. History Panel (Files uploaded so far) */
        .history-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background: rgba(9, 13, 22, 0.2);
            overflow: hidden;
        }

        .history-title {
            font-size: 0.8rem;
            font-weight: bold;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            color: var(--text-main);
            user-select: none;
        }

        .files-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(148, 163, 184, 0.1);
            background: rgba(30, 41, 59, 0.2);
            padding: 10px 12px;
            font-size: 0.8rem;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .file-icon {
            font-size: 0.9rem;
        }

        .file-name-text {
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .file-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .file-badge.pdf {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .file-badge.docx {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        /* Hidden DOM inputs */
        #hidden-file-input {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Widget Container -->
    <div class="upload-widget">
        <!-- Close overlay button -->
        <button class="close-btn" id="close-btn">×</button>

        <!-- 1. Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Ingest Area -->
        <input type="file" id="hidden-file-input" accept=".pdf,.docx,.doc">

        <!-- 2. Display and Trigger Button Row -->
        <div class="input-row">
            <div class="file-display-box" id="file-display-box">
                pdf / docx
            </div>
            <button class="upload-btn" id="upload-btn" disabled>Upload</button>
        </div>

        <!-- 3. Ingestion List -->
        <div class="history-panel">
            <div class="history-title">Files uploaded so far</div>
            <div class="files-list" id="files-list">
                <!-- Successfully copied items appear here -->
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('hidden-file-input');
        const fileDisplay = document.getElementById('file-display-box');
        const uploadBtn = document.getElementById('upload-btn');
        const progressBar = document.getElementById('progress-bar');
        const filesList = document.getElementById('files-list');
        const closeBtn = document.getElementById('close-btn');

        let selectedFilePath = null;
        let selectedFileType = null;

        // Close sidebar
        closeBtn.addEventListener('click', () => {
            if (window.mascotAPI) {
                window.mascotAPI.togglePanel();
            } else {
                console.log("[Browser Mode] Close clicked");
            }
        });

        // Trigger picker on box click
        fileDisplay.addEventListener('click', () => {
            if (window.mascotAPI) {
                window.mascotAPI.openFileSelector('all');
            } else {
                fileInput.click();
            }
        });

        // Browser fallback inputs
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const lowerName = file.name.toLowerCase();
                const ext = lowerName.split('.').pop();
                if (ext === 'pdf' || ext === 'docx' || ext === 'doc') {
                    selectedFilePath = file.name;
                    selectedFileType = ext === 'pdf' ? 'pdf' : 'docx';
                    fileDisplay.innerText = file.name;
                    fileDisplay.classList.add('selected');
                    uploadBtn.disabled = false;
                    progressBar.style.width = '0%';
                }
            }
        });

        // Drag & Drop supports
        document.body.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileDisplay.style.background = '#0d1322';
        });

        document.body.addEventListener('dragleave', () => {
            fileDisplay.style.background = 'var(--input-bg)';
        });

        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            fileDisplay.style.background = 'var(--input-bg)';

            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                const file = files[0];
                const lowerName = file.name.toLowerCase();
                const ext = lowerName.split('.').pop();
                
                if (ext === 'pdf' || ext === 'docx' || ext === 'doc') {
                    if (window.mascotAPI) {
                        const filePath = window.mascotAPI.getPathForFile(file);
                        if (filePath) {
                            selectedFilePath = filePath;
                            selectedFileType = ext === 'pdf' ? 'pdf' : 'docx';
                            fileDisplay.innerText = file.name;
                            fileDisplay.classList.add('selected');
                            uploadBtn.disabled = false;
                            progressBar.style.width = '0%';
                        }
                    } else {
                        selectedFilePath = file.name;
                        selectedFileType = ext === 'pdf' ? 'pdf' : 'docx';
                        fileDisplay.innerText = file.name;
                        fileDisplay.classList.add('selected');
                        uploadBtn.disabled = false;
                        progressBar.style.width = '0%';
                    }
                }
            }
        });

        // Trigger Copy
        uploadBtn.addEventListener('click', () => {
            if (!selectedFilePath) return;

            uploadBtn.disabled = true;
            fileDisplay.style.pointerEvents = 'none';
            progressBar.style.width = '0%';

            if (window.mascotAPI) {
                window.mascotAPI.uploadPDF(selectedFilePath, selectedFileType);
            } else {
                // Browser mode simulation
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    progressBar.style.width = `${progress}%`;

                    if (progress >= 100) {
                        clearInterval(interval);
                        appendFileItem(selectedFilePath);
                        
                        fileDisplay.innerText = 'pdf / docx';
                        fileDisplay.classList.remove('selected');
                        fileDisplay.style.pointerEvents = 'auto';
                        selectedFilePath = null;
                        selectedFileType = null;
                        fileInput.value = '';
                    }
                }, 80);
            }
        });

        function appendFileItem(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icon = ext === 'pdf' ? '📄' : '📝';
            const badgeClass = ext === 'pdf' ? 'pdf' : 'docx';

            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <div class="file-info">
                    <span class="file-icon">${icon}</span>
                    <span class="file-name-text">${filename}</span>
                </div>
                <span class="file-badge ${badgeClass}">${ext}</span>
            `;
            filesList.appendChild(item);
        }

        // Electron listeners
        if (window.mascotAPI) {
            window.mascotAPI.onFileSelected((data) => {
                const ext = data.filename.split('.').pop().toLowerCase();
                selectedFilePath = data.filePath;
                selectedFileType = ext === 'pdf' ? 'pdf' : 'docx';

                fileDisplay.innerText = data.filename;
                fileDisplay.classList.add('selected');
                uploadBtn.disabled = false;
                progressBar.style.width = '0%';
            });

            window.mascotAPI.onUploadStatus((status) => {
                if (status.success) {
                    progressBar.style.width = '100%';
                    appendFileItem(status.filename);

                    fileDisplay.innerText = 'pdf / docx';
                    fileDisplay.classList.remove('selected');
                    fileDisplay.style.pointerEvents = 'auto';
                    selectedFilePath = null;
                    selectedFileType = null;
                } else {
                    progressBar.style.width = '0%';
                    alert("Upload failed: " + status.error);
                    fileDisplay.style.pointerEvents = 'auto';
                    uploadBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
